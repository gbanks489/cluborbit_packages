name: cluborbit_matrix
description: "Reusable Signal-like chat UI and Matrix backend library for PlayerUI integration."
version: 0.0.1
publish_to: 'none'
homepage:

environment:
  sdk: ^3.11.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  clubcommon:
    path: clubcommon
  cluborbit_models:
    path: ../cluborbit_models
  provider: ^6.1.2
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^20.1.0
  firebase_storage: ^13.1.0
  google_sign_in: ^6.2.1
  http: ^1.5.0
  file_picker: ^10.3.2
  uuid: ^4.5.1
  google_fonts: ^6.3.1
  flutter_svg: ^2.2.0
  image_picker: ^1.1.2
  image: any
  cached_network_image: ^3.4.1
  emoji_picker_flutter: ^3.1.0
  flutter_dotenv: ^5.2.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.7+1
  flutter_secure_storage: ^9.2.4
  sqlcipher_flutter_libs: ^0.6.8
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.5.3
  flutter_contacts: ^1.1.9
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  record: ^6.1.1
  just_audio: ^0.10.4
  flutter_webrtc: ^1.2.0
  responsive_sizer: ^3.3.1
  go_router: ^16.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: com.cluborbit.matrix
        pluginClass: CluborbitMatrixPlugin
  assets:
    - assets/images/

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
