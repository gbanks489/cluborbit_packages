name: cluborbitchat_ui
description: PlayerChat UI package built on top of the reusable Matrix connectivity layer.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.11.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  clubcommon:
    path: ../cluborbit_matrix/clubcommon
  cluborbit_matrix:
    path: ../cluborbit_matrix
  cluborbit_models:
    path: ../cluborbit_models
  provider: ^6.1.2
  firebase_core: ^4.5.0
  firebase_messaging: ^16.0.3
  flutter_dotenv: ^5.2.1
  flutter_contacts: ^1.1.9
  flutter_map: ^7.0.0
  flutter_webrtc: ^1.2.0
  go_router: ^16.2.1
  http: ^1.5.0
  latlong2: ^0.9.1
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  file_picker: ^10.3.2
  google_fonts: ^6.3.1
  flutter_svg: ^2.2.0
  image_picker: ^1.1.2
  emoji_picker_flutter: ^3.1.0
  url_launcher: ^6.3.0
  record: ^6.1.1
  just_audio: ^0.10.4
  geolocator: ^13.0.1
  responsive_sizer: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
